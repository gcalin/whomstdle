<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whomstdle</title>
  <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
  <style>
    :root { --accent: #2f6fdb; --border: #e3e6ea; --muted: #6b7280; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #222; }
    header { border-bottom: 1px solid var(--border); background: #f7f8fa; }
    header div, main { max-width: 680px; margin: 0 auto; padding: 0 20px; }
    header h1 { margin: 0; padding: 14px 0; font-size: 20px; letter-spacing: -.2px; }
    header h1 span { color: var(--accent); }
    main { padding-top: 32px; padding-bottom: 60px; }
    .hero { font-size: 28px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.5px; }
    .sub { margin: 0 0 8px; color: var(--muted); }
    h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; margin: 32px 0 10px; }
    h2 i { font-style: normal; font-size: 13px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
    .search { position: relative; }
    input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .search ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 1; margin: 0; padding: 4px 0; list-style: none; max-height: 260px; overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .search ul:empty { display: none; }
    .search button { display: block; width: 100%; text-align: left; font: inherit; padding: 9px 14px; border: 0; background: none; cursor: pointer; }
    .search button:hover, .search button.active { background: #eef3fd; color: var(--accent); }
    .card { border: 1px solid var(--border); border-radius: 6px; padding: 4px 18px; }
    #answers { list-style: none; margin: 0; padding: 0; }
    #answers li { padding: 10px 0; border-bottom: 1px solid var(--border); }
    #answers li:last-child { border-bottom: 0; }
    #answers span { display: block; font-size: 13px; color: var(--muted); }
    #answers:empty::before { content: "Nothing yet. Ask your first question above."; display: block; padding: 10px 0; color: var(--muted); }
    #result p { margin: 12px 0 0; padding: 10px 14px; border-radius: 6px; font-weight: 600; }
    #guesses { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; list-style: none; margin: 12px 0 0; padding: 0; }
    #guesses:empty { display: none; }
    #guesses:not(:empty)::before { content: "Already tried:"; color: var(--muted); font-size: 14px; }
    #guesses li { padding: 2px 12px; border-radius: 99px; background: #fdeeee; color: #a12a2a; font-size: 14px; }
    .ok { background: #e8f6ec; color: #1d6b35; }
    .no { background: #fdeeee; color: #a12a2a; }
  </style>
</head>
<body>
  <header><div><h1>whomst<span>dle</span></h1></div></header>
  <main>
    <p class="hero">Who's the mystery person?</p>
    <p class="sub">Ask questions, collect clues, then make your guess.</p>

    <div id="play" hx-target="#play" hx-swap="innerHTML" hx-sync="#play:queue all">
{{template "play.html" .Play}}    </div>
  </main>
  <script type="application/json" id="data">{{.Data}}</script>
  <script>
    const data = JSON.parse(document.getElementById('data').textContent);

    // Every typed word must appear in the text; case and punctuation are ignored.
    const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu, '');
    const matches = (typed, texts) => {
      const words = norm(typed).split(/\s+/).filter(Boolean);
      return words.length > 0 && texts.some(t => words.every(w => norm(t).includes(w)));
    };
    const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    // What the player already used is read from the page, which the server rendered.
    const onPage = (selector, read) => new Set([...document.querySelectorAll(selector)].map(read));

    const buttons = {
      qlist: typed => {
        const asked = onPage('#answers li', li => +li.dataset.id);
        return data.questions.filter(q => !asked.has(q.id) && matches(typed, [q.text, ...(q.aliases || [])]))
          .map(q => `<button type="button" hx-post="/ask/${q.id}">${esc(q.text)}</button>`);
      },
      glist: typed => {
        const tried = onPage('#guesses li', li => +li.dataset.id);
        return data.people.filter(p => !tried.has(p.id) && matches(typed, [p.name, ...(p.aliases || [])]))
          .map(p => `<button type="button" hx-post="/guess" name="person" value="${p.id}">${esc(p.name)}</button>`);
      },
    };

    // Each search box: filter as you type; arrow keys move through the list, Enter picks (the first by default).
    // The boxes are redrawn after every reply, so the listeners are on the whole page.
    const items = box => [...box.querySelectorAll('button')];
    const mark = (box, i) => {
      items(box).forEach((b, n) => b.classList.toggle('active', n === i));
      items(box)[i]?.scrollIntoView({block: 'nearest'});
    };
    document.addEventListener('input', e => {
      const box = e.target.closest('.search');
      if (!box) return;
      const list = box.querySelector('ul');
      list.innerHTML = buttons[list.id](e.target.value).map(b => `<li>${b}</li>`).join('');
      htmx.process(list);
      mark(box, 0);
    });
    document.addEventListener('keydown', e => {
      const box = e.target.closest('.search');
      const n = box ? items(box).length : 0;
      if (!n) return;
      const current = items(box).findIndex(b => b.classList.contains('active'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        mark(box, (current + (e.key === 'ArrowDown' ? 1 : -1) + n) % n);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        items(box)[Math.max(current, 0)].click();
      }
    });
    // After a reply is drawn, put the cursor back in the box that was used.
    let used = null;
    document.addEventListener('htmx:beforeRequest', e => { used = e.target.closest('.search')?.querySelector('input').id; });
    document.addEventListener('htmx:afterSwap', () => { if (used) document.getElementById(used).focus(); });
  </script>
</body>
</html>
