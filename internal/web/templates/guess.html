{{if .Correct}}<p class="ok">🎉 That's right! {{.Name}} is today's person!</p>
{{else if .Known}}<p class="no">{{.Guess}} is not who I'm thinking of. Try again!</p>
{{else}}<p class="no">I don't even know who {{.Guess}} is!</p>{{end}}
{{if .Wrong}}<ul id="guesses" hx-swap-oob="beforeend"><li>{{.Wrong}}</li></ul>{{end}}
